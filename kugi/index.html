<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>釘撒きトラック</title>
    <meta name="description" content="トラックが道路に釘をばら撒き，後ろの車を30秒でできるだけ多くパンクさせるブラウザゲーム．">
    <!-- X などに URL を貼ったときのカード -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="釘撒きトラック">
    <meta property="og:description" content="釘を撒いて，30秒で何台パンクさせられる？">
    <meta property="og:url" content="https://ichi-choken.github.io/kugi/">
    <meta property="og:image" content="https://ichi-choken.github.io/kugi/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <style>
      /* PC では 9:16 のまま画面に収め，スマホでは画面いっぱいに出す */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: linear-gradient(#dbeffc, #78bbed); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; touch-action: none; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #9fcdf2; outline: none; display: block; }
      body.mobile #unity-canvas { left: 0; top: 0; transform: none; width: 100%; height: 100%; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 220px; text-align: center; color: #22252b; }
      #loading .title { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
      #loading .bar { height: 10px; border-radius: 5px; background: rgba(34, 37, 43, 0.2); overflow: hidden; }
      #loading .fill { height: 100%; width: 0; background: #22252b; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div class="title">釘撒きトラック</div><div class="bar"><div class="fill" id="loading-fill"></div></div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (mobile) document.body.classList.add("mobile");

      // PC：窓の中に入る一番大きな 9:16 にする
      function fit() {
        if (mobile) return;
        var h = window.innerHeight;
        var w = Math.round(h * 9 / 16);
        if (w > window.innerWidth) { w = window.innerWidth; h = Math.round(w * 16 / 9); }
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      fit();
      window.addEventListener("resize", fit);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Kugi",
        productVersion: "0.1.0",
      }, function (progress) {
        document.getElementById("loading-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.getElementById("loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loading .title").textContent = "読み込めませんでした";
        console.error(message);
      });
    </script>
  </body>
</html>
